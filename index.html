<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>
      MoMicro — The AI Agent for E-commerce | Live Data, Any API, Email
    </title>

    <!-- ─── SEO ─────────────────────────────────────────────────────────── -->
    <!-- NOTE: these static values mirror the homepage; usePublicSeo overrides
         them per-route at runtime. Keep them in sync with the homepage so the
         pre-render snapshot crawlers/social bots read is already optimal. -->
    <meta
      name="description"
      content="MoMicro is a real AI Agent for online shops: it reads your live data, calls any API, knows every shopper, and resolves support across chat and email. Start free." />
    <meta
      name="keywords"
      content="AI agent ecommerce, AI customer support agent, live data chatbot, API chatbot, autonomous support agent, email AI agent, Shopify AI agent, ecommerce chatbot, multilingual chatbot" />
    <meta
      name="language"
      content="English" />
    <meta
      name="author"
      content="MoMicro" />
    <meta
      name="category"
      content="Business Software, AI, SaaS" />
    <meta
      name="robots"
      content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />

    <!-- Canonical & hreflang are updated by usePublicSeo on every navigation -->
    <link
      rel="canonical"
      href="https://momicro.com/" />
    <link
      rel="alternate"
      hreflang="x-default"
      href="https://momicro.com/" />
    <link
      rel="alternate"
      hreflang="en"
      href="https://momicro.com/" />
    <link
      rel="alternate"
      hreflang="de-DE"
      href="https://momicro.com/de" />
    <link
      rel="alternate"
      hreflang="es-ES"
      href="https://momicro.com/es" />
    <link
      rel="alternate"
      hreflang="fr-FR"
      href="https://momicro.com/fr" />
    <link
      rel="alternate"
      hreflang="it-IT"
      href="https://momicro.com/it" />
    <link
      rel="alternate"
      hreflang="ru-RU"
      href="https://momicro.com/ru" />
    <link
      rel="alternate"
      hreflang="uk-UA"
      href="https://momicro.com/ua" />

    <!-- ─── Open Graph ───────────────────────────────────────────────────── -->
    <meta
      property="og:title"
      content="MoMicro — The AI Agent for E-commerce | Live Data, Any API, Email" />
    <meta
      property="og:site_name"
      content="MoMicro" />
    <meta
      property="og:description"
      content="Not a chatbot — a real AI Agent for your shop. It reads your live data, calls any API, knows every shopper, and resolves support across chat and email." />
    <meta
      property="og:locale"
      content="en_US" />
    <meta
      property="og:locale:alternate"
      content="de_DE" />
    <meta
      property="og:locale:alternate"
      content="es_ES" />
    <meta
      property="og:locale:alternate"
      content="fr_FR" />
    <meta
      property="og:locale:alternate"
      content="it_IT" />
    <meta
      property="og:locale:alternate"
      content="ru_RU" />
    <meta
      property="og:locale:alternate"
      content="uk_UA" />
    <!-- JPEG OG image (SVG is not supported by most social crawlers) -->
    <meta
      property="og:image"
      content="https://momicro.com/preview/og-image.jpg" />
    <meta
      property="og:image:type"
      content="image/jpeg" />
    <meta
      property="og:image:width"
      content="1200" />
    <meta
      property="og:image:height"
      content="630" />
    <meta
      property="og:image:alt"
      content="MoMicro – The AI Agent for E-commerce" />
    <meta
      property="og:type"
      content="website" />
    <meta
      property="og:url"
      content="https://momicro.com/" />

    <!-- ─── Twitter Card ────────────────────────────────────────────────── -->
    <meta
      name="twitter:card"
      content="summary_large_image" />
    <meta
      name="twitter:title"
      content="MoMicro — The AI Agent for E-commerce | Live Data, Any API, Email" />
    <meta
      name="twitter:description"
      content="Not a chatbot — a real AI Agent for your shop. Live data, any API, per-shopper memory, and email resolution. Start free." />
    <meta
      name="twitter:image"
      content="https://momicro.com/preview/og-image.jpg" />

    <!-- ─── PWA / Icons ─────────────────────────────────────────────────── -->
    <meta
      name="theme-color"
      content="#099ad9" />
    <!-- SVG favicon removed — it contained a 345 KB embedded PNG; use .png/.ico instead -->
    <link
      rel="icon"
      type="image/png"
      href="/favicon-96x96.png"
      sizes="96x96" />
    <link
      rel="shortcut icon"
      href="/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png" />
    <meta
      name="apple-mobile-web-app-title"
      content="MoMicro" />
    <link
      rel="manifest"
      href="/site.webmanifest" />

    <!-- ─── Fonts ───────────────────────────────────────────────────────── -->
    <!-- Step 1: open the TCP connection early -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin />
    <!-- Step 2: load font CSS non-blocking (display=swap is already in the URL) -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      media="print"
      onload="this.media = 'all'" />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
    </noscript>

    <!-- ─── Critical resource hints ─────────────────────────────────────── -->
    <!-- Hero logo: preloaded before React boots so LCP is not delayed -->
    <link
      rel="preload"
      as="image"
      href="/preview/logo-opt.png"
      fetchpriority="high" />
    <!-- DNS prefetch for analytics (lower priority than preconnect) -->
    <link
      rel="dns-prefetch"
      href="https://va.vercel-scripts.com" />

    <!-- ─── Structured Data ──────────────────────────────────────────────── -->
    <!-- Static Organization + WebSite for non-JS crawlers. The richer
         SoftwareApplication + FAQ schema is injected per-page by Landing.jsx;
         keeping different @types here avoids duplicate-entity confusion. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://momicro.com/#organization",
            "name": "MoMicro",
            "alternateName": "MoMicro",
            "url": "https://momicro.com/",
            "logo": "https://momicro.com/preview/logo.png",
            "description": "MoMicro is the AI Agent and AI chatbot platform for ecommerce and Shopify stores. It reads live store data, calls any REST API, and resolves customer support across chat and email.",
            "sameAs": [
              "https://www.producthunt.com/products/momicro",
              "https://github.com/MoMicro-core"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://momicro.com/#website",
            "url": "https://momicro.com/",
            "name": "MoMicro",
            "alternateName": "MoMicro",
            "publisher": { "@id": "https://momicro.com/#organization" },
            "inLanguage": [
              "en",
              "de-DE",
              "es-ES",
              "fr-FR",
              "it-IT",
              "ru-RU",
              "uk-UA"
            ]
          }
        ]
      }
    </script>
  </head>
  <body class="min-h-screen">
    <div id="root"></div>
    <script
      type="module"
      src="/src/main.jsx"></script>
    <script>
      window.MOMICRO_ASSIST_CONFIG = {
        realtimeToken: localStorage.getItem('momicro-assist-session') || '',
      };
      // The widget loads independently of the React bundle. It used to be
      // injected by a component, so it could not appear until a 417KB chunk had
      // downloaded, parsed and mounted -- and never appeared at all if that
      // failed. ChatWidget.jsx now only switches its language.
      (function () {
        var CHATBOT_ID = 'f5a65979-17c3-4935-8b6d-1c6e794a8aed';
        var host =
          window.location.hostname === 'localhost'
            ? 'http://localhost:8080'
            : 'https://api.momicro.com';
        var NAMES = {
          en: 'english', de: 'german', es: 'spanish', fr: 'french',
          it: 'italian', ru: 'russian', uk: 'ukrainian', ua: 'ukrainian'
        };
        var seg = window.location.pathname.split('/')[1] || 'en';
        var name = NAMES[seg] || NAMES[(document.documentElement.lang || 'en').slice(0, 2)] || 'english';
        var script = document.createElement('script');
        script.id = 'momicro-assist-script-' + CHATBOT_ID;
        script.defer = true;
        script.dataset.lang = name;
        script.src = host + '/chat/script/' + CHATBOT_ID + '?lang=' + name;
        document.head.appendChild(script);
      })();
    </script>
  </body>
</html>
